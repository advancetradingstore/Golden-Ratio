/* ===== ORBE ÁUREO: patrón de filotaxis (ángulo áureo 137,5°) que late con el sonido ===== */
class Phy{constructor(c,o={}){this.c=c;this.x=c.getContext('2d');Object.assign(this,{n:260,col:'gold',base:.25,bf:.4},o);
 this.t=0;this.rot=0;this.e=this.base;this.until=0;this.kv=0;this.rs();Phy.all.push(this);
 new IntersectionObserver(e=>this.vis=e[0].isIntersecting).observe(c);this.vis=true;addEventListener('resize',()=>{this.rs();this.draw()});this.draw()}
rs(){const d=Math.min(devicePixelRatio||1,2),w=this.c.clientWidth||300;this.c.width=this.c.height=Math.round(w*d);this.d=d}
pulse(ms){this.until=performance.now()+ms}
kick(a=1){this.kv=Math.max(this.kv,a)}
set(o){Object.assign(this,o);this.kick(.8);if(RM)this.draw()}
tick(dt){this.t+=dt;const tg=performance.now()<this.until?1:this.base;this.e+=(tg-this.e)*Math.min(1,dt*3);this.kv=Math.max(0,this.kv-dt*1.2);this.rot+=dt*(.05+.25*this.e);this.draw()}
draw(){const W=this.c.width,x=this.x,d=this.d,m=W/2,R=W*.45,G=2.399963,gold=this.col==='gold',amp=.02+.05*this.e+.06*this.kv;x.clearRect(0,0,W,W);
 for(let i=1;i<=this.n;i++){const f=i/this.n,r=R*Math.sqrt(f),w=Math.sin(this.t*6.283*this.bf-f*7),rr=r*(1+amp*w),a=i*G+this.rot,
  px=m+Math.cos(a)*rr,py=m+Math.sin(a)*rr,s=(.7+2.4*f)*d*(1+.35*this.e*w);
  x.globalAlpha=Math.min(1,.25+.55*f+.2*this.e*w);x.fillStyle=gold?'hsl('+(40+10*f)+',92%,'+(52+22*f)+'%)':this.col;x.beginPath();x.arc(px,py,Math.max(.4,s),0,6.283);x.fill()}
 x.globalAlpha=1}}

function osc(f,pan,dest,type='sine'){const x=A.x,o=x.createOscillator();o.type=type;o.frequency.value=f;
 if(x.createStereoPanner){const p=x.createStereoPanner();p.pan.value=pan;o.connect(p);p.connect(dest)}else o.connect(dest);o.start();return o}
function tone(fs,d=2,g=.1){try{const x=actx(),o=x.createGain(),n=x.currentTime;o.gain.setValueAtTime(0,n);o.gain.linearRampToValueAtTime(g/fs.length,n+.1);o.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(x.destination);
 fs.forEach(f=>{const s=osc(f,0,o);s.stop(n+d+.1)})}catch(e){}}

 A.on=true;gc.kick(.7);G.end=Date.now()+G.tmin*6e4;upd()}catch(e){alert(t('noaudio'))}}
